name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests (offline)
        run: npm test
      - name: Tool schema conformance (offline)
        run: npm run conformance

  # Live tests against www.flowscan.xyz. They depend on the site and its
  # undocumented routes, so they only run when started by hand from the
  # Actions tab ("Run workflow").
  smoke:
    name: Live smoke test and QA scenarios against www.flowscan.xyz
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci  # also builds dist/ via the prepare script
      - name: Smoke test (every tool, built server)
        run: npm run smoke
      - name: QA scenarios (from source)
        run: npx tsx scripts/qa/scenarios.ts
      # Opt-in mode: the same checks with FLOWSCAN_HYPERLIQUID_DIRECT=1, which
      # also reaches the four allowlisted Hyperliquid hosts.
      - name: Smoke test, hyperliquid-direct mode
        run: npm run smoke
        env:
          FLOWSCAN_HYPERLIQUID_DIRECT: "1"
      - name: QA scenarios, hyperliquid-direct mode
        run: npx tsx scripts/qa/scenarios.ts --upstream
        env:
          FLOWSCAN_HYPERLIQUID_DIRECT: "1"
